<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="panel-importar" id="panel-importar" class="panel">
  <div class="sec-hdr"><div><div class="sec-title">Importar Datos</div><div class="sec-sub">CARGA MASIVA DESDE EXCEL Y DOCUMENTOS</div></div></div>
  <div class="two-col">
    <div class="card">
		<div class="card-hdr"><div class="card-title">📥 Importar desde Excel</div></div>
		<div class="card-body">
		  <label for="file-excel-input" class="ocr-zone" style="cursor:pointer;display:block;padding:36px 24px;">
		    <div style="font-size:48px;margin-bottom:12px;">📊</div>
		    <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;">Arrastra tu archivo aquí o haz clic para seleccionar</div>
		    <div style="font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-bottom:12px;">Formatos soportados: .xlsx · .xls · .csv</div>
		    <div style="display:flex;gap:8px;justify-content:center;">
		      <span class="badge b-teal">Excel .xlsx</span>
		      <span class="badge b-gold">Excel .xls</span>
		      <span class="badge b-blue">CSV .csv</span>
		    </div>
		  </label>
		  <input type="file" id="file-excel-input" accept=".xlsx,.xls,.csv" style="display:none;" onchange="processExcelFile(this)"/>
		  <div id="excel-preview" style="display:none;margin-top:12px;"></div>
		  <div style="margin-top:16px;padding:14px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:8px;">
		    <div style="font-size:11px;color:var(--gold);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">📋 Plantilla requerida</div>
		    <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Descarga la plantilla oficial para asegurarte de que el formato sea correcto antes de importar.</div>
			<button class="btn-gold btn-sm" onclick="descargarPlantilla()">📥 Descargar plantilla</button>
		  </div>
		</div>
      </div>
    </div>
 </div>
  </div>
</div>
</body>
</html>
