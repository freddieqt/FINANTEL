<!-- ALERTAS (–) -->
<div th:fragment="panel-alertas" id="panel-alertas" class="panel">
  <div class="sec-hdr">
    <div><div class="sec-title">Centro de Alertas</div><div class="sec-sub">ALERTAS AUTOMÁTICAS DEL SISTEMA</div></div>
  </div>

  <!-- KPIs -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;">
    <div class="card" style="padding:14px;text-align:center;">
      <div style="font-size:28px;font-weight:600;color:var(--text);" id="a-total">0</div>
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">Alertas activas</div>
    </div>
    <div class="card" style="padding:14px;text-align:center;">
      <div style="font-size:28px;font-weight:600;color:var(--red);" id="a-criticas">0</div>
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">🔴 Críticas</div>
    </div>
    <div class="card" style="padding:14px;text-align:center;">
      <div style="font-size:28px;font-weight:600;color:#fbbf24;" id="a-advertencias">0</div>
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">⚠ Advertencias</div>
    </div>
    <div class="card" style="padding:14px;text-align:center;">
      <div style="font-size:28px;font-weight:600;color:var(--blue);" id="a-informativas">0</div>
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">ℹ Informativas</div>
    </div>
  </div>

  <!-- Categorías -->
  <div class="card">
    <div class="card-hdr">📋 ALERTAS POR CATEGORÍA</div>
    <div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;">
        <div><span style="color:var(--muted);">Contables</span> <span style="float:right;font-weight:600;" id="cat-contables">0</span></div>
        <div><span style="color:var(--muted);">Cuentas por cobrar</span> <span style="float:right;font-weight:600;" id="cat-cobrar">0</span></div>
        <div><span style="color:var(--muted);">Cuentas por pagar</span> <span style="float:right;font-weight:600;" id="cat-pagar">0</span></div>
        <div><span style="color:var(--muted);">Presupuesto</span> <span style="float:right;font-weight:600;" id="cat-presupuesto">0</span></div>
        <div><span style="color:var(--muted);">Documentación</span> <span style="float:right;font-weight:600;" id="cat-documentacion">0</span></div>
        <div><span style="color:var(--muted);">Seguridad</span> <span style="float:right;font-weight:600;" id="cat-seguridad">0</span></div>
      </div>
    </div>
  </div>

  <!-- Detalle de Alertas -->
  <div class="card">
    <div class="card-hdr">🔔 DETALLE DE ALERTAS</div>
    <div class="card-body" id="alertas-detalle-container"></div>
  </div>
</div>
